[package]
name = "w3c-validation"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Shared W3C RDF/SPARQL conformance test harness for de and downstream crates"
repository = "https://github.com/DeciSym/de"
publish = false

[dependencies]
anyhow = { version = "1.0", default-features = false }
de = { path = "..", default-features = false }
futures = "0.3"
oxrdf = "0.3"
oxrdfio = "0.2"
reasonable = "0.4.0"
sparesults = "0.3"
spargebra = "0.4"
