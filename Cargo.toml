[package]
name = "de"
version = "0.2.0"
authors = ["bharath181 <bharathselvaraj18@gmail.com>", "Greg Hanson <g.isaac.hanson@gmail.com>", "Donald Anthony Pellegrino Jr., Ph.D. <don@decisym.ai>"]
edition = "2024"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/DeciSym/de"
default-run = "de"
keywords = ["hdt", "rdf", "semantic-web", "triple-store", "sparql"]
categories = ["command-line-utilities"]

[[bin]]
name = "de"
path = "src/main.rs"
bench = false

[[bench]]
name = "benchmark"
harness = false

[dependencies]
anyhow = { version = "1.0", default-features = false }
async-trait = "0.1"
bzip2 = "0.6"
clap = { version = "4.5" }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["log"] }
env_logger = { version = "0.11", default-features = false }
exitcode = "1.1"
flate2 = "1"
hdt = { path = "../hdt", default-features = false, features = ["nt", "sparql", "cache"] }
http = { version = "1.4", optional = true }
log = "0.4"
oxhttp = { version = "0.3", optional=true }
oxrdf = "0.3"
oxrdfio = "0.2"
rayon = "1.11.0"
sparesults = "0.3"
spareval = { version = "0.2", features = ["sep-0002", "sep-0006"] }
spargebra = "0.4"
reasonable = "0.3.2"
tempfile = {version = "3.25"}
thiserror = "2.0"
tokio = { version = "1.49", default-features = false, features = ["full"] }
url = { version = "2.5" }

[dev-dependencies]
urlencoding = "2.1"
criterion = { version = "0.5", features = ["async_tokio"] }
futures = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
pprof = { version = "0.15", features = ["protobuf", "protobuf-codec", "criterion"] }

[package.metadata.deb]
maintainer = "DeciSym.AI <support@decisym.ai>"
copyright = "2023, DeciSym.AI."
extended-description = "CLI tool for creating and querying hdt files"
section = "utils"
priority = "optional"
assets = [
    # binary
    ["target/release/de", "usr/bin/", "755"], 

]
default-features = false

[features]
default = []
server = ["dep:oxhttp", "dep:http"]

[patch.crates-io]
reasonable = { git = "https://github.com/DeciSym/reasonable.git", rev = "840b62fb9954cefb91f816886cd83727a1752629" }
spareval = { git = "https://github.com/DeciSym/oxigraph.git", rev = "41f06ccc28650ebed22cc8354964972f3a817006" }
sparopt = { git = "https://github.com/DeciSym/oxigraph.git", rev = "41f06ccc28650ebed22cc8354964972f3a817006" }
spargebra = { git = "https://github.com/DeciSym/oxigraph.git", rev = "41f06ccc28650ebed22cc8354964972f3a817006" }
