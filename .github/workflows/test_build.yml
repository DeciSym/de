name: Build and Test

on: 
  schedule:
    - cron: '0 0 * * SAT'
  push:


env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ github.event.schedule == '' && 'stable' || 'nightly' }}
        cache: false

    - uses: Swatinem/rust-cache@v2
      with: 
        shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose

  end-to-end:
    name: end-to-end test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ github.event.schedule == '' && 'stable' || 'nightly' }}
        cache: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run Rust integration tests
      run: make test

  server-test:
    name: server test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ github.event.schedule == '' && 'stable' || 'nightly' }}
        cache: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run server integration tests
      run: cargo test --test test-server --features server

  mcp-test:
    name: mcp test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ github.event.schedule == '' && 'stable' || 'nightly' }}
        cache: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # Covers the MCP tool surface plus a live `de serve --mcp` initialize /
    # tools/list / tools/call handshake over the Streamable HTTP transport.
    - name: Run MCP integration tests
      run: cargo test --test test-mcp --features server

  w3c-conformance:
    name: W3C SPARQL/RDF conformance
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ github.event.schedule == '' && 'stable' || 'nightly' }}
        cache: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # Exercises `de`'s `do_query_with_dataset` against the upstream W3C suite
    # via the shared `w3c-validation` workspace crate. Pinned as its own job
    # (rather than buried in `make test`) so failures here surface a named
    # red/green signal in the CI run summary.
    - name: Run W3C conformance suite
      run: cargo test --test w3c-sparql --all-features

  docker-test:
    name: docker image test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ github.event.schedule == '' && 'stable' || 'nightly' }}
        cache: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Run Docker test
      run: make docker.test
