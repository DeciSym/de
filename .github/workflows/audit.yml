name: Security Audit

# No `schedule:` here on purpose -- see the note in test_build.yml. The weekly
# audit is driven by nightly.yml, which calls this workflow.
on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
